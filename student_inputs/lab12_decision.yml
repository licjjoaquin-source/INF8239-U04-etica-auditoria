priority_harm: 'Falsos negativos: un caso que sí requería revisión no es priorizado. Daño secundario: carga de revisión innecesaria (falsos positivos) concentrada en el grupo G2.'
primary_metric: Brecha de recall entre G1 y G2 (igualdad de oportunidad), acompañada de la brecha de FPR y de la tasa de selección, siempre con intervalo de confianza.
tolerance: Brecha de recall y de FPR de 0.16 como máximo, y recall global de 0.68 como mínimo (configs/governance.yml). Un grupo solo se interpreta con al menos 20 casos, 10 positivos y 10 negativos.
evidence: 'reports/e07/variants_summary.csv. Logistic: recall 0.717, brecha de recall 0.138 (IC -0.045 a 0.318), brecha de FPR 0.125 (IC -0.135 a 0.398); pasa las puertas (GO), pero los IC cruzan la tolerancia. Tree: brechas 0.181 y 0.168, falla ambas puertas (REVIEW). Sin age_band: recall 0.717, exactitud 0.725, brecha de recall 0.138.'
limitation: Prueba de solo 160 casos; G2 tiene 59 casos y 16 negativos, así que la FPR de G2 es muy incierta (IC 0.185 a 0.614). Solo 2 de 8 celdas interseccionales tienen soporte. La tasa base de G2 es más alta en la prueba (0.729) que en G1 (0.485), por lo que una brecha en la tasa de selección no prueba por sí sola discriminación. El barrido de umbral se hizo sobre la misma prueba y no debe usarse para elegir un umbral sin una validación separada. Los datos son sintéticos.
recommendation: 'Limitar: usar el modelo logístico sin age_band solo como ayuda de priorización con revisión humana obligatoria, en un piloto con datos sintéticos o de aula; no desplegar en operación real, no usarlo para decidir elegibilidad ni intervención, y no adoptar el árbol. Revisar cuando existan más casos de G2 y una validación separada.'
selected_model: logistic_sin_age
min_group_support: n>=20, positivos>=10, negativos>=10
